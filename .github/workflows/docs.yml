name: Build and Deploy Documentation

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: 4.14.x
          dune-cache: true
          opam-depext: true
          opam-depext-flags: --with-doc

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config

      - name: Install dependencies
        run: opam install . --deps-only --with-doc --with-test

      - name: Build documentation
        run: opam exec -- dune build @doc

      - name: Prepare documentation for GitHub Pages
        run: |
          mkdir -p _site
          cp -r _build/default/_doc/_html/* _site/
          # Create a .nojekyll file to prevent GitHub Pages from processing with Jekyll
          touch _site/.nojekyll
          # Create index redirect to main documentation
          cat > _site/index.html << 'EOF'
          <!DOCTYPE html>
          <html>
          <head>
            <meta charset="utf-8">
            <title>Redirecting to markdown_monolith documentation</title>
            <meta http-equiv="refresh" content="0; url=./markdown_monolith/index.html">
            <link rel="canonical" href="./markdown_monolith/index.html">
          </head>
          <body>
            <p>Redirecting to <a href="./markdown_monolith/index.html">markdown_monolith documentation</a>...</p>
          </body>
          </html>
          EOF

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
